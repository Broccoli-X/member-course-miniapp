services:
  mysql:
    image: mysql:8.4
    container_name: member-course-mysql
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: member_course
      TZ: Asia/Shanghai
    ports:
      - '3307:3306'
    volumes:
      - member-course-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  member-course-mysql-data:
